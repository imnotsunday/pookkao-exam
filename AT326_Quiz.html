<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1f2a1f;--mut:#6b7468;--line:#e3e0d6;--acc:#3d6b3a;--acc2:#e8f0e4;--ok:#2f7d4a;--okb:#e3f4e8;--no:#b23b3b;--nob:#fbe7e7;--warn:#8a5a00;--warnb:#fff4d9}
@media (prefers-color-scheme:dark){:root{--bg:#141714;--card:#1d211d;--ink:#e9ece6;--mut:#9aa396;--line:#2e342d;--acc:#8fc289;--acc2:#243024;--ok:#7fd39a;--okb:#1d3324;--no:#f08a8a;--nob:#3a2020;--warn:#f0c46a;--warnb:#3a3020}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.4rem;margin:.2em 0}.sub{color:var(--mut);margin:0 0 18px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
label.opt{display:flex;gap:10px;align-items:center;padding:8px 0;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;font:inherit;font-size:.92rem}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--card)}
button.main{background:var(--acc);color:var(--card);border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;width:100%;font-size:1rem}
button.sec{background:transparent;color:var(--acc);border:1px solid var(--acc);border-radius:10px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer;width:100%;font-size:1rem}

.top{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:.9rem;margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}.bar>i{display:block;height:100%;background:var(--acc);transition:width .25s}
.tag{font-size:.78rem;background:var(--acc2);color:var(--acc);padding:2px 9px;border-radius:999px;font-weight:600}
.q{font-size:1.08rem;font-weight:600;margin:6px 0 14px}

.ch[disabled]{cursor:default}

.big{font-size:2.6rem;font-weight:700;color:var(--acc);margin:0}

.rev .a{color:var(--ok);font-weight:600}.rev .y{color:var(--no)}

</div>
</div>
<script>

{q:"ข้อใด หมายถึง ข้าวพันธุ์ดี",c:["พันธุ์ข้าวที่มีผลผลิตสูง","พันธุ์ข้าวที่ทนทานต่อดินเปรี้ยว","พันธุ์ข้าวที่ต้านทานต่อเพลี้ยกระโดดสีน้ำตาล","ถูกทุกข้อ"],a:3,n:"ในชีทสรุปตอบ \"ต้านทานต่อเพลี้ยกระโดดสีน้ำตาล\" แต่ในข้อสอบกากบาท \"ถูกทุกข้อ\""},

{q:"หน่วยงานที่รับผิดชอบการเก็บรวบรวมเชื้อพันธุกรรมข้าวระดับนานาชาติ",c:["National Aeronautics and Space Administration (NASA)","World Trade Organization (WTO)","International Rice Research Institute (IRRI)","World Health Organization (WHO)"],a:2,n:"IRRI พัฒนาพันธุ์ IR8"},

{q:"ข้อใดเป็นพันธุ์ข้าวที่ปรับปรุงพันธุ์ด้วยการชักนำให้เกิดการกลายพันธุ์",c:["พันธุ์ขาวดอกมะลิ 105","พันธุ์ กขผ.1","พันธุ์หอมธรรมศาสตร์","พันธุ์ไรซ์เบอร์รี่"],a:2},
{q:"ข้อใด หมายถึง mutagens",c:["การผสมข้ามระหว่างสายพันธุ์","สายพันธุ์แม่ที่มีเกสรตัวผู้เป็นหมัน","การกำจัดเกสรตัวผู้ในสายพันธุ์แม่","สิ่งชักนำให้เกิดการกลายพันธุ์"],a:3},
{q:"ข้าวพันธุ์ กข.6 และ กข.15 พัฒนาพันธุ์มาจากข้าวพันธุ์ใด",c:["ข้าวเหนียวธัญสิริน","ข้าวเจ้าหอมนิล","ข้าวหอมธรรมศาสตร์","ข้าวขาวดอกมะลิ 105"],a:3},
{q:"ข้อใดเป็นวิธีลดต้นทุนในการกำจัดเกสรตัวผู้ในสายพันธุ์แม่ของขั้นตอนการผลิตเมล็ดพันธุ์ข้าวลูกผสม",c:["การกำจัดเกสรตัวผู้ด้วยไอน้ำร้อน","การถอดยอดเกสรตัวผู้","ระบบสายพันธุ์แม่ที่เกสรเพศผู้เป็นหมัน","การกำจัดเกสรตัวผู้ด้วยวิธี clipping"],a:2,n:"ระบบ A/B/R line"},

const UNITS={6:"Unit 6 · พันธุ์ข้าว",7:"Unit 7 · การปลูก",8:"Unit 8 · เก็บเกี่ยว/โรงเก็บ",9:"Unit 9 · การสี/แปรรูป"};
const L="กขคง";
const ALL=[];
EXAM1.forEach((x,i)=>ALL.push({...x,id:"e"+(i+1),u:i<30?6:7,src:"ข้อสอบ ข้อ "+(i+1)}));
EXAM2.forEach((x,i)=>{const n=55+i;ALL.push({...x,id:"e"+n,u:n<=75?7:8,src:"ข้อสอบ ข้อ "+n})});
EXAM3.forEach((x,i)=>{const n=81+i;ALL.push({...x,id:"e"+n,u:n<=95?8:9,src:"ข้อสอบ ข้อ "+n})});
EXAM4.forEach((x,i)=>{const n=109+i;ALL.push({...x,id:"e"+n,u:9,src:"ข้อสอบ ข้อ "+n})});
EXTRA.forEach((x,i)=>ALL.push({...x,id:"x"+(i+1),src:"ข้อเสริม (ชีทสรุป)",extra:1}));
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let selU=new Set([6,7,8,9]),cnt=0,set=[],idx=0,score=0,wrong=[],last=[];
$("nx").textContent=EXTRA.length;
Object.entries(UNITS).forEach(([u,t])=>{const b=document.createElement("button");b.className="chip on";b.textContent=t;b.onclick=()=>{selU.has(+u)?selU.delete(+u):selU.add(+u);b.classList.toggle("on");info()};$("units").append(b)});
[["ทั้งหมด",0],["10",10],["20",20],["40",40]].forEach(([t,n],i)=>{const b=document.createElement("button");b.className="chip"+(i==0?" on":"");b.textContent=t;b.onclick=()=>{cnt=n;[...$("counts").children].forEach(c=>c.classList.remove("on"));b.classList.add("on");info()};$("counts").append(b)});
$("extra").onchange=info;
function pool(){return ALL.filter(q=>selU.has(q.u)&&(!q.extra||$("extra").checked))}
function info(){const p=pool().length;$("poolinfo").textContent="มีให้เลือก "+p+" ข้อ";$("start").disabled=!p;
 const w=store.get("at326wrong",[]);$("nw").textContent=w.length;$("startWrong").classList.toggle("hidden",!w.length);
 const b=store.get("at326best",null);$("best").textContent=b?("รอบล่าสุด: "+b.s+"/"+b.n+" ("+b.d+")"):"";}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function prep(q){const fixed=q.c.map((t,i)=>({t,i}));const last=fixed.filter(o=>o.t==="ถูกทุกข้อ");const rest=fixed.filter(o=>o.t!=="ถูกทุกข้อ");
 const ordered=/>/.test(q.c[0])?fixed:[...shuffle(rest),...last];return {...q,opts:ordered}}
function begin(list){last=list;let s=$("shuf").checked?shuffle(list):list;if(cnt&&s.length>cnt)s=s.slice(0,cnt);
 set=s.map(prep);idx=0;score=0;wrong=[];show("quiz");render()}
function show(id){["setup","quiz","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id));window.scrollTo(0,0)}
function render(){const q=set[idx];$("pos").textContent="ข้อ "+(idx+1)+" / "+set.length;$("sc").textContent=score;
 $("pb").style.width=(idx/set.length*100)+"%";$("qtag").textContent=UNITS[q.u]+" · "+q.src;$("qt").textContent=q.q;
 $("chs").innerHTML="";$("fb").innerHTML="";$("next").classList.add("hidden");
 q.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="ch";b.innerHTML="<b>"+L[k]+".</b><span></span>";b.lastChild.textContent=o.t;b.onclick=()=>pick(k);$("chs").append(b)})}
function pick(k){const q=set[idx];const btns=[...$("chs").children];const ck=q.opts.findIndex(o=>o.i===q.a);
 btns.forEach(b=>b.disabled=true);btns[ck].classList.add("ok");const ok=k===ck;
 if(ok){score++;}else{btns[k].classList.add("no");wrong.push({q,your:q.opts[k].t})}
 $("sc").textContent=score;
 $("fb").innerHTML='<div class="fb '+(ok?'ok':'no')+'">'+(ok?'✓ ถูกต้อง':'✗ ผิด — เฉลย: '+L[ck]+'. ')+'</div>';
 if(!ok)$("fb").firstChild.append(q.opts[ck].t);
 if(q.n){const d=document.createElement("div");d.className="note";d.textContent="💡 "+q.n;$("fb").append(d)}
 const w=new Set(store.get("at326wrong",[]));ok?w.delete(q.id):w.add(q.id);store.set("at326wrong",[...w]);
 $("next").textContent=idx+1<set.length?"ข้อต่อไป →":"ดูคะแนน";$("next").classList.remove("hidden");$("next").focus()}
$("next").onclick=()=>{idx++;idx<set.length?render():finish()};
function finish(){show("result");$("rs").textContent=score+" / "+set.length;$("rp").textContent=Math.round(score/set.length*100)+"%";
 store.set("at326best",{s:score,n:set.length,d:new Date().toLocaleString("th-TH")});
 $("redoWrong").classList.toggle("hidden",!wrong.length);$("revbox").classList.toggle("hidden",!wrong.length);
 $("rev").innerHTML="";wrong.forEach(({q,your})=>{const d=document.createElement("div");d.className="rev";
  const t=document.createElement("div");t.textContent=q.q;t.style.fontWeight=600;
  const y=document.createElement("div");y.className="y";y.textContent="คุณตอบ: "+your;
  const a=document.createElement("div");a.className="a";a.textContent="เฉลย: "+q.c[q.a];d.append(t,y,a);
  if(q.n){const n=document.createElement("div");n.className="small";n.textContent="💡 "+q.n;d.append(n)}$("rev").append(d)})}
$("start").onclick=()=>begin(pool());
$("startWrong").onclick=()=>{const w=new Set(store.get("at326wrong",[]));const c=cnt;cnt=0;begin(ALL.filter(q=>w.has(q.id)));cnt=c};
$("again").onclick=()=>begin(last);
$("redoWrong").onclick=()=>{const c=cnt;cnt=0;begin(wrong.map(w=>ALL.find(q=>q.id===w.q.id)));cnt=c};
$("home").onclick=$("quit").onclick=()=>{show("setup");info()};
info();
</script></body></html>
